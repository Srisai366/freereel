# Local full stack: PostgreSQL + API + video worker + frontend.
#   docker compose up --build
# Then: docker compose exec api python -m app.cli seed
#       docker compose exec api python -m app.cli create-admin --username admin
services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: freereel
      POSTGRES_PASSWORD: freereel-local-only
      POSTGRES_DB: freereel
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U freereel"]
      interval: 5s
      retries: 10

  api: &api
    build: ./backend
    environment: &api-env
      ENVIRONMENT: development
      DATABASE_URL: postgresql://freereel:freereel-local-only@db:5432/freereel
      SECRET_KEY: local-compose-secret-change-me-0123456789abcdef
      CORS_ORIGINS: http://localhost:3000
      STORAGE_BACKEND: local
      LOCAL_STORAGE_DIR: /app/storage
      MEDIA_PUBLIC_BASE_URL: http://localhost:8000/media
    volumes:
      - media:/app/storage
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy

  worker:
    <<: *api
    command: ["python", "-m", "app.workers.video_worker"]
    ports: []
    environment:
      <<: *api-env

  frontend:
    build: ./frontend
    environment:
      API_INTERNAL_URL: http://api:8000
    ports:
      - "3000:3000"
    depends_on:
      - api

volumes:
  pgdata:
  media:
