# Production stack for a single EC2 instance, behind CloudFront.
#   cd ~/freereel/infrastructure/aws
#   docker compose -f docker-compose.prod.yml --env-file .env.prod up -d --build
# .env.prod is generated by bootstrap.sh and never committed.
name: freereel

services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: freereel
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set in .env.prod}
      POSTGRES_DB: freereel
    command: ["postgres", "-c", "shared_buffers=64MB", "-c", "max_connections=30"]
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U freereel"]
      interval: 5s
      retries: 20

  api:
    build: ../../backend
    restart: unless-stopped
    environment: &api-env
      ENVIRONMENT: production
      DATABASE_URL: postgresql://freereel:${POSTGRES_PASSWORD}@db:5432/freereel
      SECRET_KEY: ${SECRET_KEY:?set in .env.prod}
      CORS_ORIGINS: ${SITE_URL:?set in .env.prod}
      TRUST_PROXY_HEADERS: "true"
      STORAGE_BACKEND: local
      LOCAL_STORAGE_DIR: /app/storage
      # Relative URL: media is served from the same CloudFront domain as the site.
      MEDIA_PUBLIC_BASE_URL: /media
      MAX_VIDEO_MB: "4096"
    volumes:
      - media:/app/storage
      - uploads:/app/tmp_uploads
    depends_on:
      db:
        condition: service_healthy

  # Video transcoding is CPU-heavy; start it only when there's something to process:
  #   docker compose -f docker-compose.prod.yml --env-file .env.prod --profile worker up -d worker
  worker:
    build: ../../backend
    restart: unless-stopped
    profiles: ["worker"]
    command: ["nice", "-n", "10", "python", "-m", "app.workers.video_worker"]
    environment: *api-env
    volumes:
      - media:/app/storage
      - uploads:/app/tmp_uploads
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build:
      context: ../../frontend
      args:
        # Empty = the browser calls /api on the same domain (no CORS, no build-time domain needed).
        NEXT_PUBLIC_API_URL: ""
        NEXT_PUBLIC_SITE_URL: ${SITE_URL}
    restart: unless-stopped
    environment:
      API_INTERNAL_URL: http://api:8000
    depends_on:
      - api

  proxy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "80:80"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
    depends_on:
      - api
      - frontend

volumes:
  pgdata:
  media:
  uploads:
